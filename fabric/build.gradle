plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven { url = "https://api.modrinth.com/maven" } // Quad, Sodium
    maven { url = "https://maven.terraformersmc.com/" } // ModMenu
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modLocalRuntime "maven.modrinth:quad:${quad_version}+${minecraft_version}-Fabric"
    modLocalRuntime "maven.modrinth:sodium:mc${minecraft_version}-${sodium_version}-fabric"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        data {
            client()
            setConfigName('Fabric Data Gen')
            vmArgs("-Dfabric-api.datagen", "-Dfabric-api.datagen.output-dir=${project(':fabric').projectDir.toString()}/src/main/generated")
            ideConfigGenerated(true)
        }
    }
}